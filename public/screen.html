<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kitchen Screen</title>

  <style>
    :root { 
      --bg:#0b1220; 
      --card:#121a2b; 
      --text:#ffffff; 
      --muted:#9aa7c7; 
      --orange:#ff9900;
      --green:#00ff66;
      --ready:#00ff00;
      --ticker-bg:#020617;
      --ticker-text:#ffffff;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      padding-bottom:64px;
    }

    .wrap{max-width:1200px;margin:0 auto;padding:24px}

    header{
      display:flex;
      gap:16px;
      align-items:center;
      justify-content:space-between;
      margin-bottom:16px
    }

    h1{font-size:28px;margin:0}

    .right{display:flex;gap:12px;align-items:center}

    .badge{
      background:rgba(255,255,255,.08);
      padding:8px 12px;
      border-radius:12px;
      color:var(--muted);
      font-size:14px
    }

    button{
      cursor:pointer;
      border:0;
      border-radius:14px;
      padding:10px 14px;
      background:rgba(255,255,255,.12);
      color:var(--text);
      font-weight:800
    }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:12px
    }

    .row{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:12px;
      align-items:center;
      background:var(--card);
      border-radius:18px;
      padding:18px
    }

    .order{font-size:34px;font-weight:900}
    .time{font-size:40px;font-weight:900;text-align:right}
    .sub{color:var(--muted);font-size:14px;margin-top:6px}

    .ready{
      outline:3px solid rgba(0,255,0,.8);
      animation: pulse 1s infinite;
    }

    @keyframes pulse { 
      0%{box-shadow:0 0 0 rgba(0,255,0,.0)} 
      50%{box-shadow:0 0 30px rgba(0,255,0,.6)} 
      100%{box-shadow:0 0 0 rgba(0,255,0,.0)} 
    }

    /* ADS */
    .ads{
      display:none;
      width:100%;
      height:calc(100vh - 140px);
      align-items:center;
      justify-content:center;
    }

    .ads img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      border-radius:24px;
      box-shadow:0 0 40px rgba(0,0,0,.4);
    }

    /* TICKER */
    .ticker{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 56px;
      background: var(--ticker-bg);
      border-top: 2px solid rgba(255,255,255,.1);
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 9999;
    }

    .ticker-track{
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: ticker-move 30s linear infinite;
      font-size: 22px;
      font-weight: 800;
      color: var(--ticker-text);
    }

    .ticker-text{
      display: inline-block;
      padding-right: 80px;
    }

    @keyframes ticker-move {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Orders</h1>
        <div class="sub" id="updated">—</div>
      </div>
      <div class="right">
        <div class="badge" id="status">Connecting…</div>
        <button id="soundBtn">Enable alarm</button>
      </div>
    </header>

    <!-- ADS -->
    <div class="ads" id="ads">
      <img id="adsImg" src="ads1.jpg" alt="Ads">
    </div>

    <!-- ORDERS -->
    <div class="grid" id="list"></div>

    <audio id="alarm" src="ALARM.mp3" preload="auto"></audio>
  </div>

  <!-- TICKER -->
  <div class="ticker">
    <div class="ticker-track">
      <span class="ticker-text">
        เรียนไรเดอร์ทุกท่าน! ขณะนี้เรากำลังเตรียมออเดอร์ของท่านอยู่ สามารถดูเวลาการเตรียมอาหารได้ที่หน้าจอ
      </span>
      <span class="ticker-text">
        เมื่อออเดอร์พร้อมแล้ว พนักงานของเราจะนำออเดอร์ไปส่งให้ทันที ขอบคุณครับ!
      </span>
    </div>
  </div>

<script>
const API_URL = "/api/orders";
const POLL_MS = 4000;
const TICK_MS = 250;

const adsEl = document.getElementById("ads");
const listEl = document.getElementById("list");
const elUpdated = document.getElementById("updated");
const elStatus = document.getElementById("status");

let latestData = { orders: [], updated_at: 0 };

function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60);
  const s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function render(){
  const now = Date.now();
  const orders = latestData.orders || [];

  elUpdated.textContent = "Updated: " + new Date(latestData.updated_at || now).toLocaleString();

  if(!orders.length){
    adsEl.style.display="flex";
    listEl.style.display="none";
    return;
  }

  adsEl.style.display="none";
  listEl.style.display="grid";

  listEl.innerHTML = orders.map(o=>{
    const rem = (o.start_ts + o.minutes*60000 - now)/1000;
    const ready = rem<=0;

    let color="var(--orange)";
    if(rem<=600 && rem>0) color="var(--green)";
    if(rem<=0) color="var(--ready)";

    return `
      <div class="row ${ready?"ready":""}">
        <div>
          <div class="order">Order ${o.order}</div>
          <div class="sub">${o.minutes} min</div>
        </div>
        <div class="time" style="color:${color}">
          ${ready?"READY":fmt(rem)}
        </div>
      </div>
    `;
  }).join("");
}

async function poll(){
  try{
    elStatus.textContent="Loading…";
    const r=await fetch(API_URL,{cache:"no-store"});
    latestData=await r.json();
    elStatus.textContent="Online";
    render();
  }catch(e){
    elStatus.textContent="Offline";
  }
}

poll();
setInterval(poll,POLL_MS);
setInterval(render,TICK_MS);
</script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kitchen Screen</title>
  <style>
    :root { 
      --bg:#0b1220; 
      --card:#121a2b; 
      --text:#ffffff; 
      --muted:#9aa7c7; 

      --orange:#ff9900;   /* 40–10 минут */
      --green:#00ff66;    /* 10–0 минут */
      --ready:#00ff00;    /* READY ярко-зелёный */
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:1200px;margin:0 auto;padding:24px}
    header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}
    h1{font-size:28px;margin:0}
    .right{display:flex;gap:12px;align-items:center}
    .badge{background:rgba(255,255,255,.08);padding:8px 12px;border-radius:12px;color:var(--muted);font-size:14px}
    button{cursor:pointer;border:0;border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.12);color:var(--text);font-weight:700}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    .row{display:grid;grid-template-columns: 1.2fr .8fr;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:18px}
    .order{font-size:34px;font-weight:900}
    .time{font-size:34px;font-weight:900;text-align:right}
    .sub{color:var(--muted);font-size:14px;margin-top:6px}
    .ready{outline:3px solid rgba(0,255,0,.8); animation: pulse 1s infinite;}
    @keyframes pulse { 
      0%{box-shadow:0 0 0 rgba(0,255,0,.0)} 
      50%{box-shadow:0 0 30px rgba(0,255,0,.6)} 
      100%{box-shadow:0 0 0 rgba(0,255,0,.0)} 
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Orders</h1>
        <div class="sub" id="updated">—</div>
      </div>
      <div class="right">
        <div class="badge" id="status">Connecting…</div>
        <button id="soundBtn">Enable alarm</button>
      </div>
    </header>

    <div class="grid" id="list"></div>

    <!-- Твой звуковой файл. Положи его в public/ALARM.wav -->
    <audio id="alarm" src="ALARM.wav" preload="auto"></audio>
  </div>

<script>
  // ✅ если ты используешь прокси на Railway, оставь так:
  const API_URL = "/api/orders";
  // ❗ если прокси нет, тогда поставь Apps Script URL:
  // const API_URL = "https://script.google.com/macros/s/XXXXX/exec";

  const POLL_MS = 4000;
  const TICK_MS = 250;

  // 🔊 Пауза 30 секунд после окончания и перед новым стартом
  const PAUSE_AFTER_ALARM_MS = 30000;

  const elList = document.getElementById("list");
  const elUpdated = document.getElementById("updated");
  const elStatus = document.getElementById("status");
  const alarm = document.getElementById("alarm");
  const soundBtn = document.getElementById("soundBtn");

  let latestData = { orders: [], updated_at: 0 };

  // Состояние "разрешён ли звук" (после клика)
  let alarmEnabled = false;

  // Таймер перезапуска
  let restartTimer = null;

  function clearRestartTimer() {
    if (restartTimer) {
      clearTimeout(restartTimer);
      restartTimer = null;
    }
  }

  // Запуск звука (без loop — сами управляем циклом)
  function playAlarmFromStart() {
    if (!alarmEnabled) return;
    clearRestartTimer();

    try {
      alarm.pause();
      alarm.currentTime = 0;
    } catch (e) {}

    alarm.play().catch(() => {
      // если браузер вдруг снова блокирует — пользователь нажмёт кнопку
    });
  }

  // Когда звук закончился — ждём 30 сек и снова запускаем
  alarm.addEventListener("ended", () => {
    if (!alarmEnabled) return;
    clearRestartTimer();
    restartTimer = setTimeout(() => {
      playAlarmFromStart();
    }, PAUSE_AFTER_ALARM_MS);
  });

  // Если файл не проигрывается/ошибка — попробуем перезапуск
  alarm.addEventListener("error", () => {
    if (!alarmEnabled) return;
    clearRestartTimer();
    restartTimer = setTimeout(() => {
      playAlarmFromStart();
    }, 5000);
  });

  // Кнопка включения — нужна из-за запрета autoplay
  soundBtn.addEventListener("click", async () => {
    try {
      alarmEnabled = true;
      soundBtn.textContent = "Alarm enabled ✓";

      // Делаем задержку 30 секунд ПЕРЕД первым запуском (как ты попросил)
      clearRestartTimer();
      restartTimer = setTimeout(() => {
        playAlarmFromStart();
      }, PAUSE_AFTER_ALARM_MS);

    } catch (e) {
      soundBtn.textContent = "Sound blocked (tap again)";
    }
  });

  function fmtMMSS(sec) {
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function remainingSec(o, nowMs) {
    const endMs = o.start_ts + o.minutes * 60000;
    return (endMs - nowMs) / 1000;
  }

  function render() {
    const now = Date.now();
    const orders = latestData.orders || [];
    elUpdated.textContent = "Updated: " + new Date(latestData.updated_at || now).toLocaleString();

    if (!orders.length) {
      elList.innerHTML = `<div class="row"><div><div class="order">—</div><div class="sub">Нет активных заказов</div></div><div class="time"></div></div>`;
      return;
    }

    elList.innerHTML = orders.map(o => {
      const rem = remainingSec(o, now);
      const isReady = rem <= 0;
      const timeText = isReady ? "READY" : fmtMMSS(rem);

      // ===== ЛОГИКА ЦВЕТОВ =====
      // 40–10 минут: оранжевый
      // 10–0 минут: зелёный
      // READY: ярко-зелёный
      let color = "var(--orange)";
      if (rem <= 600 && rem > 0) color = "var(--green)";
      if (rem <= 0) color = "var(--ready)";
      // =========================

      return `
        <div class="row ${isReady ? "ready" : ""}">
          <div>
            <div class="order">Order ${o.order}</div>
            <div class="sub">${o.minutes} min</div>
          </div>
          <div class="time" style="color:${color}">${timeText}</div>
        </div>
      `;
    }).join("");
  }

  async function poll() {
    try {
      elStatus.textContent = "Loading…";
      const r = await fetch(API_URL, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      latestData = await r.json();
      elStatus.textContent = "Online";
      render();
    } catch (e) {
      elStatus.textContent = "Offline / API error";
    }
  }

  poll();
  setInterval(poll, POLL_MS);
  setInterval(render, TICK_MS);
</script>
</body>
</html>
